name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Forge 1.20.1
            project: forge-1.20.1
            java: 17
          - name: NeoForge 1.21.1
            project: neoforge-1.21.1
            java: 21

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        working-directory: ${{ matrix.project }}
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --no-configuration-cache
