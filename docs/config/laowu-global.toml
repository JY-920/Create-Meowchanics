wild_cats_flee = -1
# 猫咪哈气（不影响航空箱产气）
cats_hiss = -1

# 死亡变猫饼时随机扣一项基础属性：-1=存档（默认开启），0=强制关闭，1=强制开启。
cat_death_attribute_penalty_enabled = -1
# 扣除点数：-1=存档（默认20）；0=不扣除；其他非负整数=全局强制。属性上限不变，最低扣到0。
cat_death_attribute_loss = -1

# 每项倍率：-1 = 存档设置（默认 1）；0~999999 = 强制倍率。
# 支持小数，如 1.5；-1 与 0 之间的数值无效。
# 仅缩放能力公式中的属性输入，不改写猫咪基础属性/上限。
[attribute_multipliers]
# 战斗力
attack = -1
# 生命
health = -1
# 速度
speed = -1
# 耐力
stamina = -1
# 智力
intelligence = -1
# 幸运
luck = -1

# 套装伤害公式系数 K：-1 = 使用存档；0~999999 = 强制替换公式内的 K 并锁定。
# 伤害=(2+0.08×战斗力属性×战斗力倍率)×K，不是再乘一个整体伤害倍率。
# 默认系数因职业不同；不会改写猫咪属性，不改变攻速、附加状态或物流增益。
[career_damage_coefficients]
# 机械套装；套装默认系数 K = 0.75
# -1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
terminator = -1
# 钓鱼套装；套装默认系数 K = 0.55
# -1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
fishing = -1
# 飞行套装；套装默认系数 K = 2.0
# -1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
flight = -1
# 喷火套装；套装默认系数 K = 0.75
# -1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
fire = -1
# 采蜜套装；套装默认系数 K = 1.2
# -1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
honey = -1
# 物流套装；套装默认系数 K = 0.0（辅助职业，不主动攻击）
# -1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
transport = -1
# 雷管套装；套装默认系数 K = 1.5
# -1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
dynamite = -1
# 工程套装；套装默认系数 K = 3.0
# -1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
engineering = -1
# 医疗套装；套装默认系数 K = 0.0（辅助职业，不攻击）
# -1 = 沿用存档；修改 K 不会启用辅助猫攻击。
medical = -1
# 音乐猫咪（辅助职业，不攻击）；存档默认 0。
music = -1

# 套装攻速、防护、六维属性加成。每项 -1 沿用存档；其他有效值全局锁定。
# 间隔=max(最短间隔, round(基础间隔-速度缩短系数×速度属性×速度倍率))。20tick=1秒。
# 基础/最短间隔：整数1~999999；属性加成：整数0~999999；其他系数/加成：0~999999。
# 生物属性上限、有效属性999上限和受伤无敌帧仍有效。物流、医疗、音乐猫不使用攻击参数。

