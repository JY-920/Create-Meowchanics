# 全局覆盖配置（Forge / NeoForge）
# -1 = 使用各存档原有设置，不锁定游戏内选项。
# 开关：0 = 强制关闭，1 = 强制开启；请使用数字，不要写 true/false。
# 全局覆盖不会修改存档原值，改回 -1 即恢复。
# 联机时只有服务器/世界主人的此文件生效。
# 此文件位于实例或服务器根目录下的 config/laowu-global.toml。

# 词条禁用：[-1] = 使用各存档；[] = 强制不禁用；编号数组 = 全局强制禁用并锁定游戏内配置。
# 示例：disabled_traits = ["laowu:night_owl", "laowu:sky_cat"]
# 仅阻止新生成、注液、繁育继承/突变和调整棒新增；已有猫咪/猫饼的词条、等级、效果与数据保留。
